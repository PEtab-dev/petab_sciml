format_version: 2.0.0
model_files:
  lv:
    location: "lv.xml"
    language: "sbml"
measurement_files:
  - "measurements.tsv"
observable_files:
  - "observables.tsv"
experiment_files:
  - "experiments.tsv"
condition_files:
  - "conditions.tsv"
mapping_files:
  - "mapping.tsv"
parameter_files:
  - "parameters.tsv"
extensions:
  sciml:
    version: "0.1.0"
    required: true
    array_files:
      - "net3_ps.hdf5"
      - "net3_input2.hdf5"
    hybridization_files:
      - "hybridization.tsv"
    neural_networks:
      net3:
        location: "net3.yaml"
        pre_initialization: true
        format: "YAML"
